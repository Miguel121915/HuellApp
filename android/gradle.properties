# Memoria para compilar el APK: con 8 GB la compilación se caía en laptops ("insufficient memory").
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
# Kotlin compila dentro del mismo proceso de Gradle (sin otro proceso que pida más memoria)
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
