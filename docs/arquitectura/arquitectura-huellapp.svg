<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" font-family="Segoe UI, Arial, sans-serif">
  <title>Arquitectura de HuellApp</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .s { font-size: 12px; text-anchor: middle; dominant-baseline: central; }
      .linea { stroke: #5F5E5A; stroke-width: 1.3; fill: none; }
      .morado rect { fill: #EEEDFE; stroke: #534AB7; } .morado .t { fill: #3C3489; } .morado .s { fill: #534AB7; }
      .verde rect { fill: #EAF3DE; stroke: #3B6D11; } .verde .t { fill: #27500A; } .verde .s { fill: #3B6D11; }
      .coral rect { fill: #FAECE7; stroke: #993C1D; } .coral .t { fill: #712B13; } .coral .s { fill: #993C1D; }
      .gris rect { fill: #F1EFE8; stroke: #5F5E5A; } .gris .t { fill: #444441; } .gris .s { fill: #5F5E5A; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="530" fill="#FFFFFF"/>
  <text x="340" y="22" font-size="16" font-weight="700" fill="#14312E" text-anchor="middle">Arquitectura de HuellApp</text>

  <!-- Clientes -->
  <g class="morado">
    <rect x="60" y="45" width="190" height="56" rx="8"/>
    <text class="t" x="155" y="64">App móvil Flutter</text>
    <text class="s" x="155" y="83">Web y Android</text>
  </g>
  <g class="morado">
    <rect x="270" y="45" width="190" height="56" rx="8"/>
    <text class="t" x="365" y="64">Sitio web</text>
    <text class="s" x="365" y="83">HTML, CSS y JS</text>
  </g>
  <line class="linea" x1="155" y1="101" x2="155" y2="143" marker-end="url(#flecha)"/>
  <line class="linea" x1="365" y1="101" x2="365" y2="143" marker-end="url(#flecha)"/>
  <text x="240" y="125" font-size="11" fill="#5F5E5A" text-anchor="middle">HTTPS · JSON · token JWT</text>

  <!-- API -->
  <rect x="40" y="145" width="440" height="210" rx="16" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="260" y="169" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">API REST en PHP</text>
  <text x="260" y="187" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">JSON en /api/* · JWT</text>
  <g class="verde">
    <rect x="60" y="209" width="190" height="56" rx="8"/>
    <text class="t" x="155" y="228">Rutas REST</text>
    <text class="s" x="155" y="247">Auth, Reportes, Kiro…</text>
  </g>
  <g class="verde">
    <rect x="270" y="209" width="190" height="56" rx="8"/>
    <text class="t" x="365" y="228">Worker de IA</text>
    <text class="s" x="365" y="247">artisan ia:procesar</text>
  </g>
  <g class="verde">
    <rect x="60" y="281" width="190" height="56" rx="8"/>
    <text class="t" x="155" y="300">Archivos subidos</text>
    <text class="s" x="155" y="319">storage/uploads</text>
  </g>
  <g class="verde">
    <rect x="270" y="281" width="190" height="56" rx="8"/>
    <text class="t" x="365" y="300">Seguridad</text>
    <text class="s" x="365" y="319">2FA, CAPTCHA, límites</text>
  </g>

  <!-- Base de datos -->
  <line class="linea" x1="260" y1="355" x2="260" y2="393" marker-end="url(#flecha)"/>
  <g class="coral">
    <rect x="135" y="395" width="250" height="56" rx="8"/>
    <text class="t" x="260" y="414">Oracle Autonomous DB</text>
    <text class="s" x="260" y="433">Oracle Cloud · wallet</text>
  </g>

  <!-- Servicios externos -->
  <text x="585" y="133" font-size="12" font-weight="600" fill="#444441" text-anchor="middle">Servicios externos</text>
  <line class="linea" x1="480" y1="250" x2="508" y2="250" marker-end="url(#flecha)"/>
  <g class="gris">
    <rect x="510" y="145" width="150" height="56" rx="8"/>
    <text class="t" x="585" y="164">Gemini</text>
    <text class="s" x="585" y="183">Fotos y KIRO</text>
  </g>
  <g class="gris">
    <rect x="510" y="211" width="150" height="56" rx="8"/>
    <text class="t" x="585" y="230">Cloudflare</text>
    <text class="s" x="585" y="249">CAPTCHA del sitio</text>
  </g>
  <g class="gris">
    <rect x="510" y="277" width="150" height="56" rx="8"/>
    <text class="t" x="585" y="296">Google Sign-In</text>
    <text class="s" x="585" y="315">Inicio de sesión</text>
  </g>
  <g class="gris">
    <rect x="510" y="343" width="150" height="56" rx="8"/>
    <text class="t" x="585" y="362">OpenStreetMap</text>
    <text class="s" x="585" y="381">Mapas (Leaflet)</text>
  </g>
  <g class="gris">
    <rect x="510" y="409" width="150" height="56" rx="8" stroke-dasharray="4 3"/>
    <text class="t" x="585" y="428">Firebase</text>
    <text class="s" x="585" y="447">Push (pendiente)</text>
  </g>

  <!-- Leyenda -->
  <g font-size="11" fill="#444441">
    <rect x="40" y="488" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7"/><text x="58" y="498">Clientes</text>
    <rect x="125" y="488" width="12" height="12" rx="2" fill="#EAF3DE" stroke="#3B6D11"/><text x="143" y="498">Partes de la API</text>
    <rect x="250" y="488" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D"/><text x="268" y="498">Base de datos</text>
    <rect x="360" y="488" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A"/><text x="378" y="498">Servicio externo</text>
    <rect x="480" y="488" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-dasharray="3 2"/><text x="498" y="498">Pendiente</text>
  </g>
</svg>
