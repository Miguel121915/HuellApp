<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mensajes · HuellApp</title>
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap">
  <link rel="stylesheet" href="../../assets/css/base/reset.css">
  <link rel="stylesheet" href="../../assets/css/base/variables.css">
  <link rel="stylesheet" href="../../assets/css/base/tipografia.css">
  <link rel="stylesheet" href="../../assets/css/base/layout.css">
  <link rel="stylesheet" href="../../assets/css/components/navbar.css">
  <link rel="stylesheet" href="../../assets/css/components/botones.css">
  <link rel="stylesheet" href="../../assets/css/components/tarjetas.css">
  <link rel="stylesheet" href="../../assets/css/components/formularios.css">
  <link rel="stylesheet" href="../../assets/css/components/modal.css">
  <link rel="stylesheet" href="../../assets/css/pages/refugio.css">
  <script type="module" src="../../assets/js/modules/refugio/mensajes.js"></script>
</head>
<body class="pagina-refugio" data-protegida>
  <header class="encabezado" id="encabezado"></header>
  <main class="contenido">
    <h1 class="titulo-banner titulo-banner--lima">Mensajes</h1>
    <p class="texto-suave intro-seccion">Lo que te escriben los usuarios sobre tus mascotas o tu proceso de adopción. Tu respuesta les llega a «Mensajes» en la app y en el sitio.</p>
    <div id="alerta" role="status" hidden></div>
    <p id="anuncio" class="solo-lector" role="status" aria-live="polite"></p>
    <div class="filtro-mensajes" role="group" aria-label="Filtrar mensajes">
      <button class="boton boton--pequeno boton--secundario" type="button" data-filtro="pendientes" aria-pressed="true">Por responder</button>
      <button class="boton boton--pequeno boton--contorno" type="button" data-filtro="todos" aria-pressed="false">Todos</button>
    </div>
    <ul id="lista-mensajes" class="mensajes-lista"></ul>
    <p id="sin-mensajes" class="vacio tarjeta tarjeta--blanca" hidden></p>
  </main>
</body>
</html>
