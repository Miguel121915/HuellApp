<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirma tu correo · HuellApp</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap">
  <link rel="stylesheet" href="../assets/css/base/reset.css">
  <link rel="stylesheet" href="../assets/css/base/variables.css">
  <link rel="stylesheet" href="../assets/css/base/tipografia.css">
  <link rel="stylesheet" href="../assets/css/components/botones.css">
  <link rel="stylesheet" href="../assets/css/components/formularios.css">
  <link rel="stylesheet" href="../assets/css/pages/login.css">
  <script type="module" src="../assets/js/modules/auth/verificar-correo.js"></script>
</head>
<body class="pagina-login">
  <main class="codigo-correo">
    <img class="codigo-correo__logo" src="../assets/img/logos/logo-huellapp.png" alt="HuellApp" width="900" height="312">
    <section class="codigo-correo__tarjeta" aria-labelledby="titulo">
      <p class="sobretitulo">Último paso</p>
      <h1 id="titulo">Confirma tu correo</h1>
      <p class="codigo-correo__texto" id="texto-destino">Te enviamos un código de 6 dígitos a <strong id="correo-destino"></strong>. Escríbelo aquí para activar tu cuenta.</p>

      <form id="form-codigo" novalidate>
        <div id="alerta" role="alert" hidden></div>
        <!-- Solo aparece si se abrió esta página sin venir del registro o del inicio de sesión -->
        <div class="campo" id="campo-correo" hidden>
          <label class="campo__etiqueta" for="correo">Correo electrónico</label>
          <input class="campo__control" id="correo" name="correo" type="email" autocomplete="email">
          <span class="campo__error" role="status"></span>
        </div>
        <div class="campo" id="campo-codigo">
          <label class="campo__etiqueta" for="codigo">Código de verificación</label>
          <input class="campo__control campo__control--codigo" id="codigo" name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="7" placeholder="123456">
          <span class="campo__ayuda">Vence en 15 minutos. Si no lo ves, revisa tu carpeta de correo no deseado.</span>
          <span class="campo__error" role="status"></span>
        </div>
        <button class="boton boton--primario boton--bloque" id="boton-confirmar" type="submit">Confirmar y entrar</button>
      </form>

      <p class="codigo-correo__reenviar">¿No te llegó? <button type="button" class="enlace" id="boton-reenviar">Reenviar código</button></p>
      <p class="login__registro"><a class="enlace" href="login.html">Volver al inicio de sesión</a></p>
    </section>
  </main>
</body>
</html>
