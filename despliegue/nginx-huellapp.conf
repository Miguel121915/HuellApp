# /etc/nginx/sites-available/huellapp — La puerta de entrada desde internet.
#   http(s)://TU_DOMINIO/        → sitio web (lo entrega la API PHP)
#   http(s)://TU_DOMINIO/api/... → API
#   http(s)://TU_DOMINIO/app/    → app Flutter compilada para navegador (build/web)
# La instala despliegue/instalar.sh (cambia TU_DOMINIO por el dominio o la IP pública).
# HTTPS: después de instalar, ejecuta  sudo certbot --nginx -d TU_DOMINIO  (necesita un dominio).

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    # Documentos del registro de refugio y de adopción (hasta 6 × 5 MB en base64)
    client_max_body_size 45m;

    # App Flutter (compilada con --base-href /app/)
    location /app/ {
        alias /opt/huellapp/build/web/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
    }

    # Todo lo demás: API, fotos y sitio web → servidor PHP (huellapp-api.service)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La IA de los reportes y KIRO pueden tardar
        proxy_read_timeout 180s;
    }
}
